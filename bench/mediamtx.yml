logLevel: info
rtspAddress: :8554
rtmp: no
hls: no
webrtc: no
srt: no
api: no
metrics: no
pprof: no
playback: no

authMethod: internal
authInternalUsers:
  - user: bench
    pass: benchpass
    ips: []
    permissions:
      - action: read
      - action: playback
  - user: any
    pass:
    ips: [127.0.0.1]
    permissions:
      - action: publish

paths:
  "~^synthetic/(.+)$":
    runOnDemand: python -m fakecam.publish --scenario $G1 --url rtsp://127.0.0.1:$RTSP_PORT/$MTX_PATH
    runOnDemandRestart: yes
    runOnDemandStartTimeout: 15s
    runOnDemandCloseAfter: 5s
