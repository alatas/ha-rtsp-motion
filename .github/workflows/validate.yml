name: Validate

on:
  push:
  pull_request:
  schedule:
    - cron: "0 4 * * 1"
  workflow_dispatch:

jobs:
  hassfest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: home-assistant/actions/hassfest@master

  hacs:
    runs-on: ubuntu-latest
    steps:
      - uses: hacs/action@main
        with:
          category: integration

  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - run: pip install -r requirements_test.txt
      - run: pytest

  bench:
    # Fake-camera bench (bench/README.md). Informational until the known findings are fixed.
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 40
    env:
      COMPOSE: docker compose -f bench/docker-compose.yml
    steps:
      - uses: actions/checkout@v5
      - run: $COMPOSE build
      - run: $COMPOSE up -d rtsp
      - name: Wait for the RTSP server
        run: |
          $COMPOSE run --rm runner python -c "
          import socket, time
          for _ in range(30):
              try:
                  socket.create_connection(('rtsp', 8554), 1).close()
                  break
              except OSError:
                  time.sleep(1)
          else:
              raise SystemExit('rtsp did not come up')
          "
      # Each stage is continue-on-error so that all three always run and the artifact
      # uploads (the synthetic run exits 1 while the known findings fail).
      - name: Unit tests (no VIRAT data, no Home Assistant layer)
        continue-on-error: true
        run: $COMPOSE run --rm runner pytest tests -v -m "not bench_ha"
      - name: Synthetic scenarios
        continue-on-error: true
        run: $COMPOSE run --rm runner python -m runner synthetic --parallel 6
      - name: Home Assistant layer (about 2 minutes)
        continue-on-error: true
        run: $COMPOSE run --rm runner pytest tests/ha -v -m bench_ha
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bench-synthetic
          path: bench/results/synthetic.*
          if-no-files-found: warn
      - run: $COMPOSE down -v
        if: always()
